<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" fill="none">
  <!-- Book stack -->
  <g>
    <rect x="40" y="360" width="90" height="18" rx="3" fill="#1E3A8A"/>
    <rect x="46" y="342" width="90" height="18" rx="3" fill="#1E40AF"/>
    <rect x="40" y="324" width="90" height="18" rx="3" fill="#1D4ED8"/>
  </g>

  <!-- Laptop base -->
  <g>
    <path d="M70 400 L530 400 L500 430 L100 430 Z" fill="#1E3A8A"/>
    <rect x="60" y="392" width="480" height="10" rx="4" fill="#1D4ED8"/>
  </g>

  <!-- Laptop screen -->
  <g>
    <rect x="130" y="150" width="340" height="250" rx="14" fill="#2748A8"/>
    <rect x="146" y="166" width="308" height="218" rx="6" fill="#0F1E4D"/>
  </g>

  <!-- Contract paper -->
  <g>
    <rect x="185" y="120" width="200" height="260" rx="6" fill="#F8FAFC"/>
    <text x="205" y="165" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#1E3A8A">CONTRACT</text>
    <rect x="205" y="190" width="160" height="8" rx="4" fill="#CBD5E1"/>
    <rect x="205" y="212" width="160" height="8" rx="4" fill="#CBD5E1"/>
    <rect x="205" y="234" width="160" height="8" rx="4" fill="#CBD5E1"/>
    <rect x="205" y="256" width="120" height="8" rx="4" fill="#CBD5E1"/>
    <path d="M210 320 C 225 300, 240 335, 255 310 S 280 320, 300 300" stroke="#2563EB" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Shield with checkmark -->
  <g>
    <path d="M470 260 L520 240 L570 260 L570 300 C570 335 545 360 520 372 C495 360 470 335 470 300 Z" fill="#1D4ED8"/>
    <path d="M498 300 L514 316 L544 280" stroke="#7DD3FC" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Pen -->
  <g transform="rotate(-40 500 420)">
    <rect x="470" y="412" width="90" height="14" rx="7" fill="#0F1E4D"/>
    <rect x="470" y="412" width="20" height="14" rx="7" fill="#2563EB"/>
  </g>

  <!-- Floating badge: people -->
  <g>
    <rect x="20" y="220" width="56" height="56" rx="14" fill="#1E3A8A"/>
    <circle cx="40" cy="240" r="7" fill="#BFDBFE"/>
    <circle cx="56" cy="240" r="7" fill="#BFDBFE"/>
    <path d="M28 262 C28 252 34 248 40 248 C46 248 52 252 52 262" stroke="#BFDBFE" stroke-width="3" fill="none"/>
    <path d="M46 262 C46 252 52 248 58 248 C64 248 68 253 68 262" stroke="#BFDBFE" stroke-width="3" fill="none"/>
  </g>

  <!-- Floating badge: document -->
  <g>
    <rect x="470" y="130" width="56" height="56" rx="14" fill="#1E3A8A"/>
    <rect x="488" y="146" width="20" height="26" rx="2" fill="none" stroke="#BFDBFE" stroke-width="3"/>
    <line x1="492" y1="154" x2="504" y2="154" stroke="#BFDBFE" stroke-width="2"/>
    <line x1="492" y1="160" x2="504" y2="160" stroke="#BFDBFE" stroke-width="2"/>
    <line x1="492" y1="166" x2="500" y2="166" stroke="#BFDBFE" stroke-width="2"/>
  </g>

  <!-- Floating badge: chart -->
  <g>
    <rect x="524" y="290" width="56" height="56" rx="14" fill="#1E3A8A"/>
    <rect x="538" y="320" width="8" height="16" fill="#BFDBFE"/>
    <rect x="550" y="312" width="8" height="24" fill="#BFDBFE"/>
    <rect x="562" y="304" width="8" height="32" fill="#BFDBFE"/>
  </g>

  <!-- Floating badge: refresh -->
  <g>
    <rect x="12" y="330" width="56" height="56" rx="14" fill="#1E3A8A"/>
    <circle cx="40" cy="358" r="14" fill="none" stroke="#BFDBFE" stroke-width="3" stroke-dasharray="70" stroke-dashoffset="18"/>
    <path d="M50 348 L54 358 L44 356 Z" fill="#BFDBFE"/>
  </g>
</svg>
